# Looks up prices for the books in your cart (tools/prices.mjs) and saves them to data/cart-prices.json.
# Runs only when the Check prices button on the Cart tab saves data/cart-refresh.json (or by hand).
name: Prices
on:
  push:
    branches: [main]
    paths: [data/cart-refresh.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      # the latest main, not the commit that set this run off, so prices saved by the run before are kept
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/prices.mjs
      - name: Commit new prices
        run: |
          git add data/cart-prices.json
          if git diff --cached --quiet; then echo "No new prices"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update cart prices"
          # if the prices changed on main in between, this run's prices (made from the newer shelf) win
          cp data/cart-prices.json "$RUNNER_TEMP/prices.json"
          for i in 1 2 3; do
            git pull --rebase -q origin main || { git rebase --abort; git reset -q --hard origin/main; cp "$RUNNER_TEMP/prices.json" data/cart-prices.json; git add data/cart-prices.json; git commit -qm "Update cart prices"; }
            git push -q origin main && exit 0; sleep 3
          done
          exit 1
