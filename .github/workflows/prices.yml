# Looks up prices for the books in your cart (tools/prices.mjs) and saves them to data/cart-prices.json.
# The Refresh prices button on the Cart tab sets it off by saving data/cart-refresh.json; a change to the
# shelf sets it off too, so a book newly sent to the cart gets prices.
name: Prices
on:
  push:
    branches: [main]
    paths: [data/shelf.json, data/cart-refresh.json, tools/prices.mjs, .github/workflows/prices.yml]
  workflow_dispatch:
    inputs:
      refresh:
        description: Look up every book again, even ones already priced
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      # the latest main, not the commit that set this run off, so prices saved by the run before are kept
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/prices.mjs
        env:
          REFRESH: ${{ inputs.refresh && '1' || '' }}
      - name: Commit new prices
        run: |
          git add data/cart-prices.json
          if git diff --cached --quiet; then echo "No new prices"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update cart prices"
          # if the prices changed on main in between, this run's prices (made from the newer shelf) win
          cp data/cart-prices.json "$RUNNER_TEMP/prices.json"
          for i in 1 2 3; do
            git pull --rebase -q origin main || { git rebase --abort; git reset -q --hard origin/main; cp "$RUNNER_TEMP/prices.json" data/cart-prices.json; git add data/cart-prices.json; git commit -qm "Update cart prices"; }
            git push -q origin main && exit 0; sleep 3
          done
          exit 1
