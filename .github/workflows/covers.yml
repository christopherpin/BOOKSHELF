# Saves a cover for every book into covers/, so the site loads them from itself instead of looking them up
# each visit. Runs when the book list, the shelf (books you own) or the overrides change, or by hand.
name: Covers
on:
  push:
    branches: [main]
    paths: [books.js, data/shelf.json, data/cover-overrides.json, tools/covers.mjs]
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch every cover again, even ones already saved
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: covers
  cancel-in-progress: false
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/covers.mjs
        env:
          REFRESH: ${{ inputs.refresh && '1' || '' }}
      - name: Commit new covers
        run: |
          git add covers covers.js
          if git diff --cached --quiet; then echo "No new covers"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save book covers"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 3; done
          exit 1
